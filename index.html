<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TAI Prep: simulador de test para la oposición a Técnico Auxiliar Informático (AGE, SAS, Junta de Andalucía, Diputación de Sevilla). Tests por tema, simulacro cronometrado, exámenes oficiales y seguimiento de tu progreso.">
    <meta name="theme-color" content="#f1f5f9" id="theme-color-meta">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TAI Prep - Plataforma de Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
</head>
<body>
    <a class="skip-link" href="#view-root">Saltar al contenido</a>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-shell">
        <div id="nav-root" class="nav-root"></div>

        <div class="app-container glass-panel">
            <header>
                <div class="logo">
                    <span class="icon" aria-hidden="true">💻</span>
                    <h1>TAI Prep</h1>
                </div>
            </header>

            <main id="view-root" class="view-root" role="main" aria-live="polite">
                <!-- La vista activa se inyecta aquí mediante TAI.router -->
            </main>
        </div>
    </div>

    <noscript>
        <div style="padding:24px;text-align:center;font-family:sans-serif;">
            TAI Prep necesita JavaScript habilitado para funcionar.
        </div>
    </noscript>

    <!-- Banco de preguntas y supuestos: scripts clásicos sin cambios,
         definen window.baseDeDatos / window.baseDeSupuestos. -->
    <script src="preguntas.js?v=8"></script>
    <script src="supuestos.js?v=8"></script>

    <!-- Núcleo de la aplicación (namespace compartido window.TAI) -->
    <script src="js/store.js?v=8"></script>
    <script src="js/utils.js?v=8"></script>
    <script src="js/state.js?v=8"></script>
    <script src="js/theme.js?v=8"></script>
    <script src="js/router.js?v=8"></script>
    <script src="js/ui/toast.js?v=8"></script>
    <script src="js/ui/modal.js?v=8"></script>
    <script src="js/ui/nav.js?v=8"></script>

    <!-- Vistas -->
    <script src="js/views/dashboard.js?v=8"></script>
    <script src="js/views/settings.js?v=8"></script>
    <script src="js/views/chooseTest.js?v=8"></script>
    <script src="js/views/quiz.js?v=8"></script>
    <script src="js/views/results.js?v=8"></script>
    <script src="js/views/bank.js?v=8"></script>
    <script src="js/views/supuestos.js?v=8"></script>
    <script src="js/views/progress.js?v=8"></script>
    <script src="js/views/help.js?v=8"></script>

    <!-- Arranque -->
    <script src="js/main.js?v=8"></script>
</body>
</html>
